            spacing: {

      }
    </script>

    <style>
      /* Global shared styles from Stitch */
      .squishy-button {
        border-bottom: 3px solid #92001b;
        transition: all 0.1s ease;
      }
      .squishy-button:active {
        transform: translateY(2px);
        border-bottom: 1px solid #92001b;
      }
      .squishy-btn {
        box-shadow: 0 4px 0 0 #92001b;
        transition: transform 0.1s, box-shadow 0.1s;
      }
      .squishy-btn:active {
        transform: translateY(4px);
        box-shadow: 0 0px 0 0 #92001b;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(229, 231, 235, 0.5);
      }
      .stake-card-selected {
        border: 2px solid #b52330;
        background-color: #fff8ef;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
      .confetti-piece {
        position: absolute; width: 10px; height: 20px;
        background: #ffd300; top: 0; opacity: 0;
        animation: fall 3s ease-in-out infinite;
      }
      @keyframes fall {
        0% { opacity: 1; top: -10%; transform: translateX(0) rotate(0deg); }
        100% { opacity: 0; top: 100%; transform: translateX(20px) rotate(360deg); }
      }
      .confetti {
        position: absolute; width: 10px; height: 10px;
        background-color: #ff5a5f;
        animation: confFall 3s linear infinite;
      }
      @keyframes confFall {
        0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
      }
      @keyframes spinWheel {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
